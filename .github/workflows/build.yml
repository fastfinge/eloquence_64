name: Build Eloquence Add-on

on:
  push:
  pull_request:
  release:
    types: [published]

# Read-only by default.  The repository's default token is read-write, and
# non-release builds compile upstream code that isn't pinned (eloquence-contours
# master, openevv's newest CI artifact), so the build job should not be able to
# push.  Only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up 64-bit Python 3.13
        id: py64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64

      - name: Set up 32-bit Python 3.13
        id: py32
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x86
          update-environment: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Check locked dependencies
        run: uv lock --check

      - name: Lint
        run: runlint.bat
        shell: cmd

      # Runs before the proprietary fetch and the build on purpose: nothing in
      # the suite needs ECI.DLL or the built host, so failures surface early.
      - name: Unit tests
        run: runpytest.bat
        shell: cmd

      - name: Install MSYS2 / gettext
        uses: msys2/setup-msys2@v2
        with:
          install: gettext
          update: true

      - name: Add MSYS2 to PATH
        run: echo "C:\msys64\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh

      # A published release ships openevv's newest release, which is fixed and
      # needs no token.  Every other build takes openevv's newest CI artifact, so
      # pushes and pull requests catch an upstream change before a release
      # carries it.  That download needs a token with actions:read on
      # Mudb0y/openevv, which a workflow's own GITHUB_TOKEN does not carry across
      # repositories, so OPENEVV_CI_TOKEN (a PAT) is what actually works;
      # fetch_eci.py says so explicitly if the download is refused.
      - name: Fetch proprietary files
        run: python fetch_eci.py ${{ github.event_name == 'release' && '--openevv-release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.OPENEVV_CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build 32-bit host
        run: build_host.cmd
        shell: cmd
        env:
          PYTHON32: ${{ steps.py32.outputs.python-path }}

      # Same policy as openevv above: a published release ships the commit the
      # eloquence-contours submodule is pinned to, and every other build takes
      # upstream master, so an upstream change shows up here before a release
      # carries it.  Dependabot keeps the pin itself moving.  The runner image
      # already has Rust's x86_64-pc-windows-msvc toolchain.
      - name: Build Eloquence Contours
        run: build_contours.cmd ${{ github.event_name != 'release' && '--latest' || '' }}
        shell: cmd

      - name: Build addon
        run: scons.bat && scons.bat pot
        shell: cmd

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvda-addon
          path: "*.nvda-addon"
          archive: false
      
      - name: Upload pot artifact
        uses: actions/upload-artifact@v7
        with:
          name: pot-file
          path: "*.pot"
          archive: false

  # Kept in its own job because permissions cannot be conditional on the event:
  # this way only a published release ever holds a token that can write.
  # Both artifacts were uploaded with archive: false, so each artifact is named
  # after its file.  skip-decompress keeps the .nvda-addon, itself a zip, from
  # being unpacked on download.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.nvda-addon
            dist/*.pot
